name: CI

# 红线校验 + 类型检查 + 单元测试的主路径门禁（红线不豁免主分支合并，见设计文档 §十）。
# deploy-pages.yml 另含发布门禁；本工作流覆盖 PR 与主分支推送。

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 校验 + 类型 + 测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段（pnpm@12.11.2），无需硬编码。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 五条设计红线（令牌 / 图标 / 快捷键 / i18n / 命令）
      - name: Lint (design red lines)
        run: pnpm check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 单测 + 覆盖率阈值（vitest.config.ts 中 thresholds 锁定基线）
      - name: Unit tests & coverage
        run: pnpm test:coverage

      # 产物构建 + 体积红线（超出 scripts/size-budget.json 预算 + 余量则失败）
      - name: Build & size budget
        run: |
          pnpm build
          pnpm size --check

  e2e:
    name: E2E（Playwright / playground）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 仅装 chromium（E2E 用），与本地 playwright.config.ts 的 chromium 项目一致
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # webServer 会自行拉起 playground（pnpm dev），无需额外启动步骤
      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
